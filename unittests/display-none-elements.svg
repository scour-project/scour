<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- This element should be removed - style attribute -->
  <rect x="10" y="10" width="20" height="20" style="display: none; fill: red"/>
  
  <!-- This element should be removed - direct attribute -->
  <circle cx="50" cy="50" r="10" display="none" fill="blue"/>
  
  <!-- This element should NOT be removed - display block -->
  <rect x="70" y="10" width="20" height="20" style="display: block; fill: green"/>
  
  <!-- This element should NOT be removed - no display property -->
  <circle cx="50" cy="80" r="10" fill="yellow"/>
  
  <!-- This element should be removed - nested in style -->
  <rect x="30" y="60" width="15" height="15" style="fill: purple; display: none; stroke: black"/>
</svg>